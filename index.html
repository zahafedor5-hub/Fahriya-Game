<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ловля Еды</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            background: linear-gradient(to bottom, #16213e, #0f3460);
            display: block;
        }

        /* Экран Game Over */
        #game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 52, 96, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        #game-over-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        #game-over-screen h1 {
            font-size: 36px;
            color: #e94560;
            margin-bottom: 10px;
        }

        #game-over-screen p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn-restart {
            background: #e94560;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn-restart:hover {
            background: #ff5277;
            transform: scale(1.05);
        }

        .btn-restart:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="450" height="600"></canvas>
        
        <div id="game-over-screen">
            <h1>Игра Окончена!</h1>
            <p>Вы пропустили предмет!</p>
            <p>Итоговый счёт: <span id="finalScore">0</span></p>
            <button class="btn-restart" onclick="restartGame()">Играть снова</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreEl = document.getElementById('finalScore');

        // Параметры игры
        let score = 0;
        let isGameOver = false;
        let baseSpeed = 2.5;
        let speedMultiplier = 1.0;
        let spawnInterval = 100; // интервал спавна предметов (в кадрах)
        let frameCount = 0;

        // Девочка (Персонаж)
        const player = {
            x: canvas.width / 2 - 35,
            y: canvas.height - 90,
            width: 70,
            height: 80
        };

        // Список падающих предметов
        let items = [];

        // Конфигурация предметов (шансы выпадания и баллы)
        const ITEM_TYPES = [
            { type: 'fries', emoji: '🍟', score: 0.5, weight: 65, size: 40 },  // Часто (65%)
            { type: 'cola', emoji: '🥤', score: 1.0, weight: 25, size: 40 },   // Реже (25%)
            { type: 'burger', emoji: '🍔', score: 2.0, weight: 10, size: 45 }   // Очень редко (10%)
        ];

        // Функция случайного выбора предмета по весу (алгоритм вероятности)
        function getRandomItemType() {
            let totalWeight = ITEM_TYPES.reduce((sum, item) => sum + item.weight, 0);
            let random = Math.random() * totalWeight;
            
            for (let item of ITEM_TYPES) {
                if (random < item.weight) {
                    return item;
                }
                random -= item.weight;
            }
            return ITEM_TYPES[0];
        }

        // Управление (мышь и тачскрин)
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            player.x = mouseX - player.width / 2;

            // Ограничение движения краями экрана
            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        });

        canvas.addEventListener('touchmove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const touchX = e.touches[0].clientX - rect.left;
            player.x = touchX - player.width / 2;

            if (player.x < 0) player.x = 0;
            if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            e.preventDefault();
        });

        // Создание нового падающего предмета
        function spawnItem() {
            const config = getRandomItemType();
            const x = Math.random() * (canvas.width - config.size);
            
            items.push({
                x: x,
                y: -config.size,
                size: config.size,
                emoji: config.emoji,
                score: config.score,
                speed: (baseSpeed + Math.random() * 0.8) * speedMultiplier
            });
        }

        // Отрисовка персонажа (Девочка)
        function drawPlayer() {
            ctx.save();
            
            // Голова
            ctx.fillStyle = '#ffdbac';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 30, 22, 0, Math.PI * 2);
            ctx.fill();

            // Причёска (Пучок волос сверху)
            ctx.fillStyle = '#4a2c11';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 7, 14, 0, Math.PI * 2);
            ctx.fill();

            // Волосы по бокам
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 25, 24, Math.PI, Math.PI * 2);
            ctx.fill();

            // Глаза
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2 - 8, player.y + 28, 2.5, 0, Math.PI * 2);
            ctx.arc(player.x + player.width / 2 + 8, player.y + 28, 2.5, 0, Math.PI * 2);
            ctx.fill();

            // Улыбка
            ctx.strokeStyle = '#d32f2f';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(player.x + player.width / 2, player.y + 32, 6, 0.1 * Math.PI, 0.9 * Math.PI);
            ctx.stroke();

            // Туловище / Одежда
            ctx.fillStyle = '#3a506b';
            ctx.beginPath();
            ctx.roundRect(player.x + 15, player.y + 50, player.width - 30, 30, 8);
            ctx.fill();

            ctx.restore();
        }

        // Обновление состояния игры
        function update() {
            if (isGameOver) return;

            frameCount++;

            // Со временем скорость плавно растёт
            speedMultiplier += 0.0003;

            // Спавн предметов
            if (frameCount % Math.max(30, Math.floor(spawnInterval / speedMultiplier)) === 0) {
                spawnItem();
            }

            // Движение и проверка столкновений
            for (let i = items.length - 1; i >= 0; i--) {
                let item = items[i];
                item.y += item.speed;

                // Проверка подбора (попадание в область игрока)
                if (
                    item.y + item.size >= player.y &&
                    item.y <= player.y + player.height &&
                    item.x + item.size >= player.x &&
                    item.x <= player.x + player.width
                ) {
                    score += item.score;
                    items.splice(i, 1);
                    continue;
                }

                // Если предмет пропущен и упал ниже экрана -> GAME OVER
                if (item.y > canvas.height) {
                    endGame();
                    return;
                }
            }
        }

        // Отрисовка всех элементов
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Отрисовка счета
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 22px Arial';
            ctx.fillText(`Счёт: ${score.toFixed(1)}`, 15, 35);
            ctx.font = '14px Arial';
            ctx.fillStyle = '#a0a0a0';
            ctx.fillText(`Скорость: x${speedMultiplier.toFixed(1)}`, 15, 55);

            // Отрисовка предметов
            for (let item of items) {
                ctx.font = `${item.size}px Arial`;
                ctx.fillText(item.emoji, item.x, item.y + item.size);
            }

            // Отрисовка игрока
            drawPlayer();
        }

        // Главный цикл игры
        function gameLoop() {
            update();
            draw();
            if (!isGameOver) {
                requestAnimationFrame(gameLoop);
            }
        }

        // Конец игры
        function endGame() {
            isGameOver = true;
            finalScoreEl.textContent = score.toFixed(1);
            gameOverScreen.classList.add('active');
        }

        // Перезапуск игры
        function restartGame() {
            score = 0;
            speedMultiplier = 1.0;
            frameCount = 0;
            items = [];
            isGameOver = false;
            gameOverScreen.classList.remove('active');
            requestAnimationFrame(gameLoop);
        }

        // Старт игры
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
